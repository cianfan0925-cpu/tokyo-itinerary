<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5eee4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="东京行程" />
    <meta name="description" content="东京七日行程互动演示" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.css" />
    <link rel="stylesheet" href="./styles.css" />
    <title>东京七日行程</title>
  </head>
  <body>
    <main class="app-shell" aria-label="东京七日行程互动演示">
      <section class="map-stage" aria-label="当日路线地图">
        <div id="map" class="map-art" role="application" aria-label="东京行程互动地图"></div>
        <div class="map-message" id="mapMessage" role="status" hidden>
          <strong id="mapMessageTitle">地图准备中</strong>
          <p id="mapMessageText"></p>
        </div>

        <div class="top-actions">
          <button class="round-button" id="backButton" aria-label="返回">‹</button>
          <div class="map-title"><span>东京</span><small id="mapDayLabel">10月15日 · 周四</small></div>
          <button class="round-button" id="moreButton" aria-label="更多选项">•••</button>
        </div>

        <button class="locate-button" id="locateButton" aria-label="定位到当前行程">◎</button>
        <div class="map-tools" aria-label="地图视角">
          <button id="viewButton" aria-pressed="true">3D</button>
          <button id="lightButton" aria-label="切换地图光照">日光</button>
          <button id="overviewButton" aria-label="查看当日地点概览">全览</button>
        </div>
        <div class="map-toast" id="mapToast" role="status" aria-live="polite"></div>
      </section>

      <section class="trip-sheet" id="tripSheet" aria-label="可拖动的行程面板">
        <div class="drag-zone" id="dragZone" aria-label="上下拖动行程面板" role="slider" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0" tabindex="0">
          <span class="drag-handle"></span>
        </div>

        <div class="sheet-scroll" id="sheetScroll">
          <header class="trip-heading">
            <div>
              <p class="eyebrow">TOKYO · 7 DAYS</p>
              <h1>东京，七日漫游</h1>
              <p class="trip-meta">10.12 — 10.18 · 香港往返</p>
            </div>
            <button class="bookmark-button" id="bookmarkButton" aria-label="收藏这趟行程" aria-pressed="false">♡</button>
          </header>

          <nav class="date-strip" id="dateStrip" aria-label="选择行程日期"></nav>

          <section class="day-summary">
            <div>
              <p class="day-kicker" id="dayKicker">10月15日 · 周四</p>
              <h2 id="dayTheme">魔法世界 · 哈利波特影城</h2>
            </div>
            <div class="summary-actions">
              <button class="weather-chip is-loading" id="weatherChip" type="button" aria-label="刷新当地即时天气">
                <span class="weather-icon" id="weatherIcon" aria-hidden="true">·</span>
                <span class="weather-copy">
                  <strong id="weatherTemperature">--°</strong>
                  <small id="weatherMeta">正在获取当地天气</small>
                </span>
                <span class="weather-refresh" aria-hidden="true">↻</span>
              </button>
              <button class="map-mode-button" id="mapModeButton">看地图</button>
            </div>
          </section>

          <div class="timeline" id="timeline" aria-live="polite"></div>
          <p class="source-note">图片用于私人行程演示，地点与时间来自所附行程表第一页。</p>
        </div>

        <button class="collapsed-summary" id="collapsedSummary" aria-label="展开今日行程">
          <span><strong id="collapsedTitle">今日行程</strong><small id="collapsedMeta">3 个安排</small></span>
          <span class="up-chevron">⌃</span>
        </button>
      </section>
    </main>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.32.0/mapbox-gl.js"></script>
    <script src="./config.js"></script>
    <script src="./app.js?v=4"></script>
  </body>
</html>
