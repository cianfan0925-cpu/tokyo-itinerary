name: Deploy Tokyo itinerary
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure public map token
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
        run: |
          node -e 'const fs = require("fs"); fs.writeFileSync("config.js", "window.TRIP_CONFIG = " + JSON.stringify({mapboxToken: process.env.MAPBOX_PUBLIC_TOKEN || "", mapboxStyle: "mapbox://styles/mapbox/standard"}) + ";\n");'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
